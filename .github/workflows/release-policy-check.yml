name: Plugin Release Policy Check

on:
  pull_request:
    paths:
      - 'packages/**/package.json'
      - 'scripts/validate-plugin-release-policy.mjs'
      - '.github/workflows/*.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**/package.json'
      - 'scripts/validate-plugin-release-policy.mjs'
      - '.github/workflows/*.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-plugin-release-policy.mjs
